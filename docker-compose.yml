services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vigia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-vigia_app}
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${VIGIA_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vigia"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["python", "-m", "vigia.store.migrate"]
    environment:
      DATABASE_URL: postgresql://vigia_app:${APP_DB_PASSWORD:-vigia_app}@postgres:5432/vigia
      MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/vigia
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://vigia_app:${APP_DB_PASSWORD:-vigia_app}@postgres:5432/vigia
      MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/vigia
      VIGIA_MODO: ${VIGIA_MODO:-prod}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      VIGIA_KEK: ${VIGIA_KEK:-}
      PII_HMAC_KEY: ${PII_HMAC_KEY:-}
      VIGIA_PANEL_TOKEN: ${VIGIA_PANEL_TOKEN:-}
    ports:
      - "127.0.0.1:${VIGIA_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
