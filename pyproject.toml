[project]
name = "vigia"
version = "0.1.0"
description = "Scam sentinel for small businesses: forward anything suspicious, get a verdict."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32.0",
    "bandit>=1.9.4",
    "git-cliff>=2.14.2",
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "interrogate>=1.7.0",
    "mypy>=2.4.0",
    "pdoc>=16.0.0",
    "pip-audit>=2.10.1",
    "pylint>=4.1.3",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D", "C901", "PLR0913", "PLR0915"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 40

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
